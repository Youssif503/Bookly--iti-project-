<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Books — Bookly</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="books">

<div id="navbar-mount"></div>

<main class="container">
  <div class="page-header">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
      <div>
        <h2>All Books</h2>
        <p class="text-muted mb-0" id="resultsInfo">Loading results…</p>
      </div>
      <form class="input-group search-input-group" id="booksSearchForm" style="max-width: 320px;">
        <span class="input-group-text"><i class="bi bi-search text-muted"></i></span>
        <input type="text" class="form-control" id="booksSearchInput" placeholder="Search books...">
      </form>
    </div>
  </div>

  <div class="row g-4 py-3">
    <aside class="col-lg-3">
      <div class="filter-sidebar mb-3">
        <h6>Categories</h6>
        <ul class="category-filter-list" id="categoryFilterList"></ul>

        <h6>Sort By</h6>
        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="sortOption" id="sortRelevance" value="relevance" checked>
          <label class="form-check-label" for="sortRelevance">Newest First</label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="sortOption" id="sortRating" value="rating">
          <label class="form-check-label" for="sortRating">Top Rated</label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="radio" name="sortOption" id="sortAZ" value="az">
          <label class="form-check-label" for="sortAZ">A - Z</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="sortOption" id="sortZA" value="za">
          <label class="form-check-label" for="sortZA">Z - A</label>
        </div>
      </div>
    </aside>

    <div class="col-lg-9">
      <div id="booksGrid"></div>
      <nav class="mt-4" aria-label="Books pagination">
        <ul class="pagination justify-content-center" id="booksPagination"></ul>
      </nav>
    </div>
  </div>
</main>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/favorites.js"></script>
<script src="js/components.js"></script>
<script src="js/books.js"></script>
</body>
</html>
