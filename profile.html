<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Bookly</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="profile">

<div id="navbar-mount"></div>

<main class="container pb-5" id="profileRoot">
  <div class="page-header">
    <h2>My Profile</h2>
    <p class="text-muted">Manage your account information</p>
  </div>

  <div class="row g-4">
    <aside class="col-lg-3">
      <div class="profile-sidebar">
        <div class="list-group">
          <a href="#" class="list-group-item profile-tab-link active" data-tab="tabProfileInfo"><i class="bi bi-person"></i> Profile Information</a>
          <a href="#" class="list-group-item profile-tab-link" data-tab="tabMyReviews"><i class="bi bi-star"></i> My Reviews</a>
          <a href="#" class="list-group-item profile-tab-link" data-tab="tabReadingList"><i class="bi bi-bookmark"></i> Reading List</a>
          <a href="#" class="list-group-item profile-tab-link" data-tab="tabSettings"><i class="bi bi-gear"></i> Settings</a>
          <a href="#" class="list-group-item text-danger" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
      </div>
    </aside>

    <div class="col-lg-9">

      <!-- Profile Information -->
      <div class="profile-tab-pane" id="tabProfileInfo">
        <div class="profile-card">
          <div class="row g-4 align-items-center">
            <div class="col-md-3 text-center">
              <img id="profileAvatar" src="" alt="Profile picture" class="profile-avatar-lg mb-2">
              <div><a href="#" class="btn-link-pink small">Change Photo</a></div>
            </div>
            <div class="col-md-9">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label small text-muted mb-1">Full Name</label>
                  <div class="fw-semibold" id="profileFullName">—</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label small text-muted mb-1">Email</label>
                  <div class="fw-semibold" id="profileEmail">—</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label small text-muted mb-1">Username</label>
                  <div class="fw-semibold" id="profileUsername">—</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- My Reviews -->
      <div class="profile-tab-pane d-none" id="tabMyReviews">
        <div class="profile-card">
          <h5 class="mb-3">My Reviews</h5>
          <div class="state-box py-4">
            <i class="bi bi-star"></i>
            <h5>No reviews yet</h5>
            <p class="mb-0">Reviews you write on book pages will appear here.</p>
          </div>
        </div>
      </div>

      <!-- Reading List (saved / favorite books) -->
      <div class="profile-tab-pane d-none" id="tabReadingList">
        <div class="profile-card">
          <h5 class="mb-3">Reading List</h5>
          <div id="savedBooksGrid"></div>
        </div>
      </div>

      <!-- Settings -->
      <div class="profile-tab-pane d-none" id="tabSettings">
        <div class="profile-card">
          <h5 class="mb-3">Account Settings</h5>
          <form id="settingsForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="settingsFullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="settingsFullName">
              </div>
              <div class="col-md-6">
                <label for="settingsEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="settingsEmail">
              </div>
              <div class="col-md-6">
                <label for="settingsUsername" class="form-label">Username</label>
                <input type="text" class="form-control" id="settingsUsername">
              </div>
              <div class="col-12">
                <label for="settingsBio" class="form-label">Bio</label>
                <textarea class="form-control" id="settingsBio" rows="3"></textarea>
              </div>
            </div>
            <button type="submit" class="btn btn-pink mt-3">Save Changes</button>
          </form>
        </div>
      </div>

    </div>
  </div>
</main>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/favorites.js"></script>
<script src="js/components.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
