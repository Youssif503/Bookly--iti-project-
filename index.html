<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookly — Discover Your Next Great Read</title>
<meta name="description" content="Bookly is an online book library — search, browse categories, and discover your next favorite book.">
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="home">

<div id="navbar-mount"></div>

<main>
  <!-- Hero Section -->
  <section class="hero-section">
    <div class="container">
      <div class="row align-items-center g-4">
        <div class="col-lg-6">
          <h1 class="hero-title mb-3">Discover Your <br>Next Great Read</h1>
          <p class="hero-desc mb-4">Search from thousands of books, explore categories, and find your next favorite book.</p>
          <form class="input-group hero-search" id="heroSearchForm" style="max-width: 480px;">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" class="form-control border-start-0" id="heroSearchInput" placeholder="Search for books, authors, or genres...">
            <button class="btn btn-pink" type="submit">Search</button>
          </form>
        </div>
        <div class="col-lg-6 text-center">
          <img src="assets/hero-illustration.svg" alt="Illustration of books, a plant, and a cup of coffee" class="hero-illustration">
        </div>
      </div>
    </div>
  </section>

  <!-- Featured Books -->
  <section>
    <div class="container">
      <div class="section-heading-row">
        <h2 class="section-title">Featured Books</h2>
        <a href="books.html" class="view-all-link">View All &rarr;</a>
      </div>
      <div id="featuredBooksGrid"></div>
    </div>
  </section>

  <!-- Browse Categories -->
  <section>
    <div class="container">
      <div class="section-heading-row">
        <h2 class="section-title">Browse Categories</h2>
        <a href="categories.html" class="view-all-link">View All &rarr;</a>
      </div>
      <div class="row g-3" id="homeCategoriesGrid"></div>
    </div>
  </section>

  <!-- Statistics -->
  <section>
    <div class="container">
      <div class="stats-bar">
        <div class="row g-3">
          <div class="col-6 col-md-3">
            <div class="stat-item">
              <i class="bi bi-book-half stat-icon"></i>
              <div>
                <div class="stat-number">50K+</div>
                <div class="stat-label">Books</div>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="stat-item">
              <i class="bi bi-person-fill stat-icon"></i>
              <div>
                <div class="stat-number">10K+</div>
                <div class="stat-label">Authors</div>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="stat-item">
              <i class="bi bi-grid-fill stat-icon"></i>
              <div>
                <div class="stat-number">25+</div>
                <div class="stat-label">Categories</div>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="stat-item">
              <i class="bi bi-people-fill stat-icon"></i>
              <div>
                <div class="stat-number">100K+</div>
                <div class="stat-label">Happy Readers</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/favorites.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
</body>
</html>
