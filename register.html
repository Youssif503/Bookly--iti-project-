<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Bookly</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="register">

<div id="navbar-mount"></div>

<main class="auth-wrapper">
  <div class="auth-card">
    <div class="text-center mb-4">
      <h3>Create Your Account</h3>
      <p class="text-muted">Join Bookly and start your reading journey</p>
    </div>

    <div class="alert alert-danger d-none" id="registerAlert" role="alert"></div>

    <form id="registerForm" novalidate>
      <div class="mb-3">
        <label for="regFullName" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="regFullName" placeholder="Enter your full name" required>
      </div>
      <div class="mb-3">
        <label for="regEmail" class="form-label">Email</label>
        <input type="email" class="form-control" id="regEmail" placeholder="Enter your email" required>
      </div>
      <div class="mb-3">
        <label for="regPassword" class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="regPassword" placeholder="Create a password" minlength="6" required>
          <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#regPassword"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <div class="mb-3">
        <label for="regConfirm" class="form-label">Confirm Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="regConfirm" placeholder="Confirm your password" minlength="6" required>
          <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#regConfirm"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-pill-pink w-100 mb-3">Register</button>
      <p class="text-center small mb-0">Already have an account? <a href="login.html" class="btn-link-pink">Sign In</a></p>
    </form>
  </div>
</main>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/favorites.js"></script>
<script src="js/components.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
