<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authors — Bookly</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="authors">

<div id="navbar-mount"></div>

<main class="container pb-5">
  <div class="page-header">
    <h2>Authors</h2>
    <p class="text-muted">Discover your favorite authors</p>
  </div>

  <form class="input-group search-input-group mb-4" id="authorsSearchForm" style="max-width: 380px;">
    <span class="input-group-text"><i class="bi bi-search text-muted"></i></span>
    <input type="text" class="form-control" id="authorsSearchInput" placeholder="Search authors...">
  </form>

  <div class="row g-3" id="authorsGrid"></div>

  <div class="text-center mt-4">
    <button class="btn btn-pill-pink px-4" id="viewAllAuthorsBtn">View All Authors</button>
  </div>
</main>

<div id="footer-mount"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/favorites.js"></script>
<script src="js/components.js"></script>
<script src="js/authors.js"></script>
<script>
  document.getElementById('viewAllAuthorsBtn').addEventListener('click', () => {
    document.getElementById('authorsSearchInput').value = '';
    renderAuthors(BOOKLY_AUTHORS, document.getElementById('authorsGrid'));
    BooklyUI.showToast('Showing all authors');
  });
</script>
</body>
</html>
